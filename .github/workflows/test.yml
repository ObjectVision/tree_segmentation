name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU torch only: the suite never touches a GPU, and the default
          # wheel would pull ~2 GB of CUDA for nothing.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"

      - name: Test
        # Network-marked tests hit PDOK; they are excluded so CI does not
        # depend on a third-party service being up.
        run: pytest -m "not network"

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core only
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"

      - name: Licence sweep
        # This project shipped a GPL-3.0 dependency unnoticed once. It runs on
        # the core install deliberately: optional extras are allowed to carry
        # licences the core must not.
        run: pytest tests/test_licences.py -v
